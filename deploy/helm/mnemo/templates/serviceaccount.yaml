apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
rules:
  - apiGroups: ['', apps, batch, networking.k8s.io, rbac.authorization.k8s.io, storage.k8s.io]
    resources: [nodes, namespaces, pods, deployments, daemonsets, statefulsets, replicasets, jobs, cronjobs, services, ingresses, networkpolicies, configmaps, persistentvolumes, persistentvolumeclaims, roles, rolebindings, serviceaccounts, events, storageclasses]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [list]
  - apiGroups: [kubeovn.io, kyverno.io, wgpolicyk8s.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews, selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
