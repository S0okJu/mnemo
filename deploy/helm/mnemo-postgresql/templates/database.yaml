apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: mnemo}
            - {name: POSTGRES_DB, value: mnemo}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ required "existingSecret is required" .Values.existingSecret }}, key: password}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec: {command: [pg_isready, -U, mnemo, -d, mnemo]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, mnemo, -d, mnemo]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- if .Values.storage.local.enabled }}
        volumeName: {{ .Release.Namespace }}-{{ .Release.Name }}-data
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storage.size }}}
