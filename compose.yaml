services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: mnemo
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
secrets:
  postgres_password:
    file: ${MNEMO_POSTGRES_PASSWORD_FILE:?Set path to a local password file}
volumes:
  postgres-data:
